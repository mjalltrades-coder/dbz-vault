name: Build DBZ Vault APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q DBZ-Vault-GitHub-APK-Build-Ready.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk DBZ-Vault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DBZ-Vault-Android-APK
          path: DBZ-Vault.apk
          if-no-files-found: error
          retention-days: 30
