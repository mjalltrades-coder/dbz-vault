name: Build DBZ Vault APK
on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * *'
  push:
    branches: [main]
    paths:
      - DBZ-Vault-GitHub-APK-Build-Ready.zip.partaa
      - DBZ-Vault-GitHub-APK-Build-Ready.zip.partab
      - .github/workflows/build-apk.yml
permissions:
  contents: write
concurrency:
  group: dbz-vault-prices-and-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble Android source archive
        run: cat DBZ-Vault-GitHub-APK-Build-Ready.zip.partaa DBZ-Vault-GitHub-APK-Build-Ready.zip.partab > DBZ-Vault-GitHub-APK-Build-Ready.zip
      - name: Unpack Android project
        run: unzip -q DBZ-Vault-GitHub-APK-Build-Ready.zip -d android-project
      - name: Fix loading video delivery and launch duration
        if: github.event_name != 'schedule'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-project')
          java = root / 'app/src/main/java/com/dbzvault/collector/MainActivity.java'
          source = java.read_text()
          old = '"dragon-intro-atlas.webp","dragon-intro-frame.webp").contains(name)) return null;'
          new = '"dragon-intro-atlas.webp","dragon-intro-frame.webp","loading-video.mp4").contains(name)) return null;'
          assert old in source, 'Expected WebView asset allowlist not found'
          source = source.replace(old, new, 1)
          old = 'String mime=name.endsWith(".css")?"text/css":name.endsWith(".js")?"application/javascript":name.endsWith(".json")||name.endsWith(".webmanifest")?"application/json":name.endsWith(".webp")?"image/webp":"text/html";\n            return new WebResourceResponse(mime,"UTF-8",in);'
          new = 'String mime=name.endsWith(".mp4")?"video/mp4":name.endsWith(".css")?"text/css":name.endsWith(".js")?"application/javascript":name.endsWith(".json")||name.endsWith(".webmanifest")?"application/json":name.endsWith(".webp")?"image/webp":"text/html";\n            return new WebResourceResponse(mime,name.endsWith(".mp4")?null:"UTF-8",in);'
          assert old in source, 'Expected WebView MIME response not found'
          java.write_text(source.replace(old, new, 1))
          html = root / 'app/src/main/assets/index.html'
          page = html.read_text()
          old = 'animation:splash-auto-dismiss 6s ease 1 both'
          assert old in page, 'Expected CSS splash timer not found'
          page = page.replace(old, 'animation:none', 1)
          old = '#launch-splash .splash-glow,#launch-splash .splash-energy-rays,#launch-splash .splash-shockwave,#launch-splash .splash-particles,#launch-splash .splash-3d,#launch-splash .splash-head-flight,#launch-splash .splash-ball{display:none!important}'
          new = '#launch-splash .splash-glow,#launch-splash .splash-energy-rays,#launch-splash .splash-shockwave,#launch-splash .splash-particles,#launch-splash .splash-3d,#launch-splash .splash-dragon-motion,#launch-splash .splash-art,#launch-splash .splash-head-flight,#launch-splash .splash-ball,#launch-splash .splash-vignette,#launch-splash .splash-center{display:none!important}'
          assert old in page, 'Expected legacy splash artwork not found'
          page = page.replace(old, new, 1)
          old = 'const delay=reduced?500:2750;'
          assert old in page, 'Expected JS splash timer not found'
          page = page.replace(old, 'const delay=5200;', 1)
          html.write_text(page)
          gradle = root / 'app/build.gradle'
          build = gradle.read_text()
          old = "versionCode 139; versionName '1.39-video-only'"
          assert old in build, 'Expected v1.37 version not found'
          gradle.write_text(build.replace(old, "versionCode 139; versionName '1.39-video-only'", 1))
          readme = root / 'README.txt'
          readme.write_text(readme.read_text() + '\nVersion 1.39 hides leftover splash artwork so the loading video appears without the old animation bleeding through.\n')
          PY
      - name: Restore existing development signing key
        run: |
          git show 18964351ead1127b68013136ae659e868f519987:DBZ-Vault-GitHub-APK-Build-Ready.zip > "$RUNNER_TEMP/prior-vault-source.zip"
          unzip -p "$RUNNER_TEMP/prior-vault-source.zip" debug.keystore > android-project/debug.keystore
      - name: Restore the last good price snapshot
        if: github.event_name == 'schedule'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/price-data; then
            git show origin/price-data:prices.json > "$RUNNER_TEMP/previous-prices.json"
            python3 - "$RUNNER_TEMP/previous-prices.json" android-project/app/src/main/assets/market-prices.json <<'PY'
          import json,sys,datetime
          from pathlib import Path
          old,new=map(Path,sys.argv[1:]);prior=json.loads(old.read_text());bundled=json.loads(new.read_text())
          stamp=lambda x:datetime.datetime.fromisoformat(x['updated'].replace('Z','+00:00'))
          if prior.get('matcherVersion',1)>=bundled.get('matcherVersion',1) and stamp(prior)>=stamp(bundled):new.write_text(old.read_text())
          PY
          fi
      - name: Refresh daily market prices
        if: github.event_name == 'schedule'
        working-directory: android-project
        run: python3 -u scripts/sync_prices.py
      - name: Publish the public price feed
        if: github.event_name == 'schedule'
        run: |
          cp android-project/app/src/main/assets/market-prices.json "$RUNNER_TEMP/dbz-prices.json"
          if git show-ref --verify --quiet refs/remotes/origin/price-data; then
            git switch --create price-sync origin/price-data
          else
            git switch --orphan price-sync
          fi
          cp "$RUNNER_TEMP/dbz-prices.json" prices.json
          git add prices.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh daily DBZ market price snapshot'
          fi
          git push origin HEAD:price-data
          git switch main
      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: github.event_name != 'schedule'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        if: github.event_name != 'schedule'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        if: github.event_name != 'schedule'
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify and name APK
        if: github.event_name != 'schedule'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-project/app/build/outputs/apk/debug/app-debug.apk | head -5
          cp android-project/app/build/outputs/apk/debug/app-debug.apk DBZ-Vault-Portfolio.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: DBZ-Vault-Android-APK
          path: DBZ-Vault-Portfolio.apk
          if-no-files-found: error
          retention-days: 30
