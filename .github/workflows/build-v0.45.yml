name: Build DBZ Vault 0.45 APK
on:
  push:
    branches: [main]
    paths:
      - DBZ-Vault-v0.45-Build-Source.zip
      - .github/workflows/build-v0.45.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack verified v0.45 source
        run: unzip -q DBZ-Vault-v0.45-Build-Source.zip -d android-project
      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify package and signature
        run: |
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          cp "$APK" DBZ-Vault-v0.45.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DBZ-Vault-v0.45-APK
          path: DBZ-Vault-v0.45.apk
          retention-days: 30
